# Resolve-chain proxy — read by aryavidya.py (video resolution chain ONLY).
# The CDN stream proxy in server.py never uses this file.
#
# How to use:
#   1. Put ONE proxy URL on the first non-comment line, e.g.:
#        http://user:pass@host:port
#        socks5://user:pass@host:port
#   2. Save + commit + push — Render redeploys and picks it up.
#      (No restart needed locally: the file is re-read on every resolve.)
#
# Priority: this file WINS when it contains a value; otherwise the
# EDUHUBPI_RESOLVE_PROXY environment variable is used as fallback.
# Keep this file comment-only to rely on the environment variable.
#
# WARNING: this repository is PUBLIC — never commit a proxy URL that
# contains credentials unless the repo is made private first.
