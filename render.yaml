services:
  - type: web
    name: eduhubpi-video-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # single worker = one shared cache + per-video locks; internal resolve
    # budget is ~55s (gunicorn timeout keeps headroom above that)
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
